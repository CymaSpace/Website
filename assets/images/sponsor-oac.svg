<svg xmlns="http://www.w3.org/2000/svg" width="220" height="60" viewBox="0 0 220 60" fill="none">
  <!-- Portland Rose / Star Emblem -->
  <g transform="translate(10, 8)">
    <!-- Background Badge Circle -->
    <rect width="44" height="44" rx="10" fill="#E8F5E9" />
    <circle cx="22" cy="22" r="16" fill="#0D5C3A" />
    <!-- Stylized Rose Petals / Star -->
    <path d="M22 10 C24 16 28 18 34 18 C28 20 26 24 26 30 C24 24 20 22 14 22 C20 20 22 16 22 10 Z" fill="#FACC15" />
    <circle cx="22" cy="22" r="4" fill="#FFFFFF" />
    <circle cx="22" cy="22" r="2" fill="#0D5C3A" />
    <!-- Branch Leaves -->
    <path d="M16 27 C18 31 22 33 26 31" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>
  <!-- Typography -->
  <g transform="translate(64, 0)">
    <text x="0" y="27" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="0.8">CITY OF PORTLAND</text>
    <text x="0" y="43" fill="#0D5C3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.2">Office of Arts &amp; Culture</text>
  </g>
</svg>
