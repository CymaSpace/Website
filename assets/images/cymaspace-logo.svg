<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cymaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Cymatic Ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#cymaGrad)" stroke-width="2.5" opacity="0.6" />
  <!-- Resonant Flower / Geometric Petals -->
  <path d="M50 6 C62 25 75 38 94 50 C75 62 62 75 50 94 C38 75 25 62 6 50 C25 38 38 25 50 6 Z" stroke="url(#cymaGrad)" stroke-width="3" fill="none" filter="url(#glow)" />
  <!-- Diagonal Harmonic Harmonies -->
  <circle cx="50" cy="50" r="26" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
  <circle cx="50" cy="50" r="14" stroke="#FF2A85" stroke-width="2" fill="none" />
  <!-- Sound Source Center -->
  <circle cx="50" cy="50" r="6" fill="#00F0FF" filter="url(#glow)" />
</svg>
